services:
  ubersdr_skimmer:
    container_name: skimmer
    image: madpsy/ubersdr_skimmer:latest
    restart: unless-stopped
    cpu_shares: 512
    # /dev/shm: WSPR's recordings and decoding, and wsprnet's queued spots,
    # live there (Docker's default 64 MB is too small for FST4W-1800 on many bands)
    shm_size: "4gb"
    environment:
      # UberSDR base URL
      UBERSDR_URL: "http://ubersdr:8080"
      # Bands to skim: "all" is what CW Skimmer Server skims (160-6 m, 60 m,
      # the beacon frequencies), less what the receiver cannot tune; one IQ
      # stream each, so mind the receiver's session limit. Or e.g. "40,30,20".
      BANDS: "all"
      # Report spots to the Reverse Beacon Network (as RBN Aggregator does),
      # as CALLSIGN-# with the receiver's call, name, QTH and locator by
      # default; "false" turns it off
      RBN: "true"
      # RBN_MODES: "cw,rtty,ft8,ft4"  # the modes whose spots go to RBN (default all); e.g. "cw" alone
      # Width of each IQ stream: iq48, iq96, iq192 or iq384; wider, fewer
      # streams (sessions) for the same bands
      IQ_MODE: "iq192"
      # Report spots (CW, RTTY, JTTY, FT, JS8) to PSK Reporter as CALLSIGN at
      # LOCATOR. Set "false" if UberSDR already uploads its CW skimmer's spots
      # to PSKReporter with cwskimmer.yaml pointing here, or each goes twice
      PSKREPORTER: "true"
      # Skim CW and spot its calls: telnet port 7300, RBN and PSK Reporter;
      # "false" turns it off, leaving RTTY, JTTY, FT, WSPR and JS8 running
      CW: "true"
      # Silence where the UberSDR's packets went missing (found by their
      # timestamps), so WSPR and FT keep time; "false" turns it off
      GAP_FILL: "true"
      # Decode RTTY (the web page's RTTY tab) and spot its calls: telnet
      # port 7301, RBN and PSK Reporter as RTTY; "false" turns it off
      RTTY: "true"
      # Decode WSJT-X 3.2's JTTY on its dials (the web page's JTTY tab) and
      # spot its callers: telnet port 7302 and PSK Reporter; "false" turns it off
      JTTY: "true"
      # Your callsign: spots go out (to telnet and RBN) as CALLSIGN-#.
      # Empty: the receiver's CW skimmer callsign, else its callsign.
      CALLSIGN: ""
      # Decoders run at once, each mode's own: WSPR's, FST4W's, and each FT
      # mode's (every dial's together; an FT cycle waits its turn); empty:
      # half the cores, at least 2, at most 4
      WSPR_THREADS: ""
      FST4W_THREADS: ""
      FT8_THREADS: ""
      FT4_THREADS: ""
      FT2_THREADS: ""
      # FT8, FT4, FT2 and JS8 on every band skimmed that has the mode's dial
      # ("true"); or e.g. "20,40"; "false" off
      FT8: "true"
      FT4: "true"
      FT2: "true"
      JS8: "true"
      # FT decoding depth: fast, normal or deep
      FT8_DEPTH: "deep"
      FT4_DEPTH: "deep"
      FT2_DEPTH: "deep"
      # WSPR and FST4W on every band skimmed that has a WSPR dial ("true"),
      # every mode (WSPR, WSPR-15, FST4W-120 to -1800), deep; "false" off
      WSPR: "true"
      WSPR_MODES: "all"
      WSPR_DEPTH: "deep"
      # Upload WSPR and FST4W spots to wsprnet.org as CALLSIGN at LOCATOR; set
      # "false" if UberSDR already uploads this receiver's WSPR
      WSPRNET: "true"
      # Uncomment and set as needed (empty = the default):
      # UBERSDR_PASSWORD: ""  # the receiver's password, if it has one
      # MIN_MARGIN: "15"      # reduced-depth IQ, dB under the noise; 0 = lossless
      # NAME: ""              # operator, for the telnet sign-on and RBN (default: the receiver's)
      # QTH: ""               # location (default: the receiver's)
      # LOCATOR: ""           # 6-character locator (default: the receiver's)
      # VALIDATION: "normal"  # relaxed, normal or strict
      # RBN_DRY_RUN: "false"  # sign on to RBN and judge spots, but upload none
      # RBN_BAD_CALLS: "false"  # "true": send RBN no spot of a call in ./cache/BadCalls.txt (one call a line)
      # WEB_PORT: "6101"      # the web page, proxied by UberSDR at /addon/skimmer/
      # TELNET_PORT: "7300"   # DX-cluster telnet (CW Skimmer Server's format), RTTY's on the next port, JTTY's the one after; 0 = off
      # AGG_TELNET_PORT: ""   # with RBN, the reporter's local-user telnet (e.g. 7550)
      # FREQ_CALIBRATION: "1"  # multiply frequencies by SM7IUN's correction factor (web page, Analytics tab)
      # CW_ENGINE: "text"     # how CW's calls are read: text (from the decoded text) or bayesian (letters labelled by a word model)
      # NOISE_FILTER: "true"  # "false": track signals in SSB, data and noise in the CW segments too
      # RTTY_FILTER: "true"   # "false": track signals on RTTY too
      # MAX_RTTY: "100"      # RTTY signals each band decodes at once (its streams share them)
      # RTTY_ENGINE: "bayesian" # how RTTY's calls are read: bayesian (each character's bits weighed) or text
      # AUTO_CALIBRATE: "false" # "true": with RBN, calibrate by SM7IUN's daily skew as each list comes in
      # RTTY_TENS_HZ: "false" # "true": RTTY spots' frequencies to 10 Hz (14083.45), as RTTY Skimmer Server's TensHz
      # PSKREPORTER_ANTENNA: ""  # the antenna, as PSK Reporter shows it
      # STATIC_FILTER: "full"  # static crashes: "full" start and keep no track, "starts" start none, "off" track as any signal
      # WSJTX_OUT: ""         # HOST:PORT, e.g. "192.168.1.20:2237": FT8/FT4/FT2, WSPR and FST4W decodes sent there
      #                       #   as WSJT-X sends its own over UDP (GridTracker, JTAlert...); give the PC's own address
      # WSJTX_OUT_ID: ""      # the instance's Id there (default "UberSDR Skimmer")
      # QRZ_USER: ""          # QRZ.com login (XML Data subscription), only if UberSDR's own lookups
      # QRZ_PASSWORD: ""      #   are off: calls are looked up through UberSDR's lookup_services
      # QRZ_VALIDATE: "false"  # "true": spot only calls QRZ knows (spots still go when QRZ cannot answer)
      # RADIO: "true"         # "false": no Radio tab (a 192 kHz session of its own while a page has it open)
      # RADIO_PASSWORD: ""    # the Radio tab tuned only by a page that gives this (anyone may watch)
      # FETCH: "true"         # "false": never download cty.dat, MASTER.SCP and the like; the built-in copies are used
      # PATT3CH_FILE: "true"  # your own patt3ch.lst, in ./cache; also CTY_FILE, SCP_FILE, CALLS_FILE, BCN_FILE,
      #                       # RTTY_CONTESTS_FILE ("true": the file of that name in ./cache, or a path); never fetched over
      # EXTRA_ARGS: ""        # anything else (see: docker exec skimmer ubersdr-skimmer --help)
      # CONFIG: "/data/config/ubersdr-skimmer/config.json"  # settings from a config file
      #                     # instead of these variables (see the README); with the
      #                     # ./config volume below, the file is
      #                     # ./config/ubersdr-skimmer/config.json beside this one
    volumes:
      # Fetched cty.dat/MASTER.SCP/RBN lists, FFTW wisdom and RBN state
      - ./cache:/data/cache
      # With CONFIG: the config file's directory
      # - ./config:/data/config
    # The telnet port is reachable from the other containers as skimmer:7300,
    # RTTY's spots (RTTY Skimmer Server's format) as skimmer:7301, JTTY's
    # as skimmer:7302, every mode's as skimmer:7303.
    # To reach it from outside Docker, uncomment (dxcluster may already
    # have 7300 on the host; pick another host port if so):
    # ports:
    #   - "7300:7300"
    networks:
      - sdr-network
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "skimmer"

networks:
  sdr-network:
    external: true
    name: ubersdr_sdr-network
